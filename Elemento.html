<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Non Metals in Elemental periodic table</title>
    <h1>Enter A Non Metal</h1>
</head>

<body>
    <!-- Form -->
    <div class="container-center"></div>
    <form> <input type="text" id="NonM" placeholder=" enter Element"> <br>
        <input type="button" py-click="get_Element" value="search"> <br>

        <div id="div1"></div>

    </form>
    </div>
    <py-script src="main3.py"> </py-script>
    </div>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            font-family: system-ui, "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(rgba(0, 0, 0, .65), rgba(0, 0, 0, .88)),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* NAVIGATION BAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;

            background: rgba(5, 12, 25, .96);
            border-bottom: 3px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0, 100, 255, .2);
        }

        nav a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            padding: 10px 17px;
            background: #101e35;
            border: 1px solid #345b91;
            border-radius: 4px;
            transition: .3s;
        }

        nav a:hover {
            color: #fff;
            background: #0755a5;
            border-color: #e5c45b;
            box-shadow: 0 0 15px rgba(0, 130, 255, .6);
            transform: translateY(-3px);
        }

        nav a.active {
            color: #ffe08a;
            background: #123b68;
            border-color: #d4af37;
        }

        /* MAIN CREATOR CARD */
        #output {
            max-width: 600px;
            margin: 65px auto 100px;
            padding: 60px 35px 35px;
            position: relative;

            background: linear-gradient(145deg,
                    rgba(12, 28, 52, .97),
                    rgba(3, 8, 18, .97));

            border: 1px solid #c5a23b;
            border-radius: 10px;
            line-height: 1.8;
            font-size: 1.05rem;

            box-shadow:
                0 0 25px rgba(0, 100, 255, .2),
                0 0 15px rgba(212, 175, 55, .12),
                0 15px 40px rgba(0, 0, 0, .8);
        }

        /* GOLDEN HEADER */
        #output::before {
            content: "NINJA DOJO  •  MASTER OF ELEMENTS";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            padding: 10px;
            text-align: center;

            color: #071426;
            background: linear-gradient(90deg,
                    #98751d,
                    #ffe28a,
                    #c49a30);

            border-radius: 9px 9px 0 0;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        /* INTRODUCTION */
        #output div:nth-child(1) {
            color: #65baff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: .9rem;
            font-weight: bold;
        }

        /* CREATOR NAME */
        #output div:nth-child(2) {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.2;
            color: #f5d778;
            text-shadow: 0 0 15px rgba(0, 120, 255, .4);
        }

        /* DESCRIPTION */
        #output div:nth-child(3) {
            color: #c5d2e2;
            margin-bottom: 25px;
        }

        /* SECTION HEADINGS */
        #output div:nth-child(4),
        #output div:nth-child(6),
        #output div:nth-child(8),
        #output div:nth-child(10) {
            margin-top: 25px;
            color: #e4bd50;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: .9rem;
            font-weight: 800;

            border-bottom: 1px solid #315d91;
            padding-bottom: 7px;
        }

        /* FINAL QUOTE */
        #output div:nth-child(12) {
            margin-top: 30px;
            padding: 20px;

            color: #f5d778;
            font-style: italic;

            background: rgba(0, 100, 200, .13);
            border-left: 4px solid #d4af37;
            border-radius: 4px;
        }

        ::selection {
            background: #d4af37;
            color: #071426;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 650px) {
            #output {
                margin: 30px 15px 60px;
                padding: 55px 22px 25px;
            }

            #output div:nth-child(2) {
                font-size: 1.8rem;
            }

            nav a {
                font-size: 11px;
                padding: 9px 12px;
            }
        }
    </style>
    </head>
